# Drop this file into /etc/beamd/ next to your beamd.yaml.
# Set the Cloudflare token (or whichever DNS provider you're using) in
# /etc/beamd/.env, then:
#
#   cd /etc/beamd && docker compose up -d
#
# Tail logs:    docker compose logs -f
# Stop:         docker compose down

services:
  beamd:
    image: ghcr.io/treyhuffine/beamd:latest
    container_name: beamd
    restart: unless-stopped

    # :443 is the only public port. ALPN-demuxed: public HTTPS visitors
    # share it with beam client control connections.
    ports:
      - "443:443"

    volumes:
      # Read-only config + tokens.
      - /etc/beamd:/etc/beamd:ro
      # Read-write: cert cache + ACME account state survive restarts.
      - /var/lib/beamd:/var/lib/beamd

    environment:
      - BEAMD_DNS_PROVIDER_CREDS=${BEAMD_DNS_PROVIDER_CREDS}

    # The default entrypoint is `beamd serve --config /etc/beamd/beamd.yaml`.
