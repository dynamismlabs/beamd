# Drop this file into /etc/beamd/ next to your beamd.yaml.
# Set the Cloudflare token (or whichever DNS provider you're using) in
# /etc/beamd/.env, then:
#
#   cd /etc/beamd && docker compose up -d
#
# Tail logs:    docker compose logs -f
# Stop:         docker compose down

services:
  beamd:
    image: ghcr.io/dynamismlabs/beamd:latest
    container_name: beamd
    restart: unless-stopped

    # Run as root. Needed to bind privileged :443, read tokens.json
    # (0600), and let `add-developer` write tokens.json + the cert cache.
    # Matches the systemd (User=root) deployment in Appendix A.
    user: "0:0"

    # certmagic finds the DNS-01 zone via an SOA lookup. Some hosts'
    # default resolver intermittently SERVFAILs, which breaks ACME
    # issuance — pin stable public resolvers.
    dns:
      - 1.1.1.1
      - 8.8.8.8

    # Public HTTPS and tuned TLS/yamux share TCP 443. QUIC tunnel sessions use
    # UDP 443. Both mappings are required before opting an agent into `auto`.
    ports:
      - "443:443/tcp"
      - "443:443/udp"

    volumes:
      # rw (not :ro) so `beamd add-developer` can update tokens.json.
      - /etc/beamd:/etc/beamd
      # cert cache + ACME account state survive restarts.
      - /var/lib/beamd:/var/lib/beamd

    environment:
      - BEAMD_DNS_PROVIDER_CREDS=${BEAMD_DNS_PROVIDER_CREDS}
      # Optional yamux per-stream receive window (bytes); default 4 MiB when unset.
      # Key-only form: forwarded from /etc/beamd/.env when set, and left ABSENT
      # (not empty) when unset — a present-but-empty value is a fatal startup error.
      - BEAMD_YAMUX_STREAM_WINDOW_BYTES
      # QUIC stays disabled until B4 qualification and the production pilot.
      # Key-only form preserves YAML/default behavior when an override is absent.
      - BEAMD_LISTEN_QUIC
      - BEAMD_DISABLE_QUIC
      - BEAMD_MAX_STREAMS_PER_SESSION
      - BEAMD_MAX_STREAMS_TOTAL
      - BEAMD_MAX_PRE_AUTH_SESSIONS
      - BEAMD_MAX_SESSIONS_TOTAL
      # Recommended for the documented 2 GiB single-user host.
      - GOMEMLIMIT

    # The default entrypoint is `beamd serve --config /etc/beamd/beamd.yaml`.
