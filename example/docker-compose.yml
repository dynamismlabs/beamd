# Drop this file into /etc/conduit/ next to your conduitd.yaml.
# Set the Cloudflare token (or whichever DNS provider you're using) in
# /etc/conduit/.env, then:
#
#   cd /etc/conduit && docker compose up -d
#
# Tail logs:    docker compose logs -f
# Stop:         docker compose down

services:
  conduitd:
    image: ghcr.io/treyhuffine/conduitd:latest
    container_name: conduitd
    restart: unless-stopped

    # :443 is the only public port. ALPN-demuxed: public HTTPS visitors
    # share it with conduit client control connections.
    ports:
      - "443:443"

    volumes:
      # Read-only config + tokens.
      - /etc/conduit:/etc/conduit:ro
      # Read-write: cert cache + ACME account state survive restarts.
      - /var/lib/conduit:/var/lib/conduit

    environment:
      - CONDUIT_DNS_PROVIDER_CREDS=${CONDUIT_DNS_PROVIDER_CREDS}

    # The default entrypoint is `conduitd serve --config /etc/conduit/conduitd.yaml`.
