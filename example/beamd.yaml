# Beamd server example config.
# Every field can be overridden via BEAMD_<UPPER_SNAKE_CASE> env vars
# (e.g. BEAMD_BASE_DOMAIN, BEAMD_DNS_PROVIDER_CREDS).

base_domain: beam.example.com

# Public IPs the edge listens on — written into DNS by `beamd provision-dev`.
edge_ipv4: 127.0.0.1
edge_ipv6: ""

# Public ingress and (ALPN-demuxed) client control on the same port.
# Use :443 in production; :8443 here so local dev doesn't need root.
listen_https: ":8443"

acme_email: ops@example.com
# acme_ca:
#   blank   → Let's Encrypt production
#   off     → self-signed (local dev / tests only; browsers will warn)
#   <URL>   → custom ACME directory (e.g. LE staging)
acme_ca: "off"

# DNS provider. The OSS binary compiles in `cloudflare` and `stub`.
# Stub is in-memory — fine for local dev / e2e tests.
dns_provider: stub
dns_provider_creds: ""         # provider-specific (Cloudflare: API token)

# Token → slug map. MVP is a JSON file; the path here is dev-relative.
# Quote scheme-style strings to keep YAML from parsing the colon as a key.
token_store: "file:./tokens.json"

# Where beamd persists state (cert cache, ACME account, ...).
# Production: /var/lib/beamd.
data_dir: ./data

max_tunnels_per_token: 25

# Hosted-deployment only: advertise device-code login endpoints at
# /.well-known/beam-auth. The CLI's `beam login` (no --token)
# fetches this and runs the browser-based flow against the URLs below.
# Leave the whole block out for OSS deployments — the CLI then falls
# back to requiring --token.
#
# auth_discovery:
#   device_code_url: https://app.example.com/api/device/code
#   token_url:       https://app.example.com/api/device/token
#   verification_uri: https://app.example.com/device

# Hosted-deployment only: push per-slug usage deltas (bytes proxied,
# active tunnels, request count) to a billing webhook on an interval.
# OSS users leave this unset and scrape `/metrics` for the same data.
#
# usage_reporter:
#   webhook_url:      https://app.example.com/api/internal/usage
#   secret_env:       BEAMD_USAGE_SECRET     # env var holding the bearer token
#   interval_seconds: 60
#   state_file:       /var/lib/beamd/usage-state.json  # default: <data_dir>/usage-state.json
