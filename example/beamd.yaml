# Beamd server example config.
# Every field can be overridden via BEAMD_<UPPER_SNAKE_CASE> env vars
# (e.g. BEAMD_BASE_DOMAIN, BEAMD_DNS_PROVIDER_CREDS).

base_domain: beam.example.com

# Public IPs the edge listens on — written into DNS by `beamd provision-dev`.
edge_ipv4: 127.0.0.1
edge_ipv6: ""

# Public ingress and (ALPN-demuxed) client control on the same port.
# Use :443 in production; :8443 here so local dev doesn't need root.
listen_https: ":8443"

acme_email: ops@example.com
# acme_ca:
#   blank   → Let's Encrypt production
#   off     → self-signed (local dev / tests only; browsers will warn)
#   <URL>   → custom ACME directory (e.g. LE staging)
acme_ca: "off"

# DNS provider. The OSS binary compiles in `cloudflare` and `stub`.
# Stub is in-memory — fine for local dev / e2e tests.
dns_provider: stub
dns_provider_creds: ""         # provider-specific (Cloudflare: API token)

# Registered DNS zone to write records in. Leave blank to auto-detect
# from base_domain (recommended) — this is what lets base_domain be a
# subdomain of your zone (e.g. base_domain=tunnel.dynami.sm resolves
# to zone dynami.sm). Set explicitly only to skip the provider lookup.
dns_zone: ""

# Token → slug map. MVP is a JSON file; the path here is dev-relative.
# Quote scheme-style strings to keep YAML from parsing the colon as a key.
token_store: "file:./tokens.json"

# Where beamd persists state (cert cache, ACME account, ...).
# Production: /var/lib/beamd.
data_dir: ./data

max_tunnels_per_token: 25

# Strip iframe-blocking headers (X-Frame-Options, CSP frame-ancestors)
# from tunnel responses so previews can be embedded cross-origin in a
# consumer app. Off by default — an app's own framing policy is kept.
preview_embed: false

# Hosted-deployment only: advertise device-code login endpoints at
# /.well-known/beam-auth. The CLI's `beamd login` (no --token)
# fetches this and runs the browser-based flow against the URLs below.
# Leave the whole block out for OSS deployments — the CLI then falls
# back to requiring --token.
#
# auth_discovery:
#   device_code_url: https://app.example.com/api/device/code
#   token_url:       https://app.example.com/api/device/token
#   verification_uri: https://app.example.com/device

# Per-request event log. Always on: every proxied request is appended as one
# JSON line to <data_dir>/requests.log (OSS gets request logs for free). The
# visitor IP is minimized AT THE EDGE before it's written.
#
# request_log:
#   enabled:   true            # default true
#   path:      /var/lib/beamd/requests.log   # default <data_dir>/requests.log
#   max_size_mb: 128           # rotate at this size
#   ip_mode:   truncate        # truncate (/24, /48) | off (don't record the IP)
#   capture:                   # analytics fields (billing fields always ship)
#     path: true
#     user_agent: true
#     referer: true

# Hosted-deployment only: ship the request-event log to the control plane, which
# attributes + aggregates it for usage/billing. OSS users leave this unset (the
# local file + `/metrics` are still there).
#
# request_reporter:
#   webhook_url: https://app.example.com/api/internal/requests
#   secret_env:  BEAMD_REQUESTS_SECRET   # env var holding the bearer token
#   batch_size:  500
#   flush_ms:    1000
#   cursor_file: /var/lib/beamd/requests.cursor  # default <data_dir>/requests.cursor
